<!--
  Axiom Paper Trader mark (spec §15): a duotone green/pink candlestick pair in a rounded
  badge, in the same visual language as Axiom's own pill badges.

  Deliberately only TWO candles, drawn thick. Three would turn to mush at the 16px
  toolbar size, and the toolbar icon is the one a user actually has to recognise.
  Colours are the buy/sell tokens from src/ui/tokens.css.
-->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <rect width="128" height="128" rx="28" fill="#0a0e14" />

  <!-- Up candle (buy green): wick then body -->
  <rect x="40" y="22" width="8" height="84" rx="4" fill="#22c55e" />
  <rect x="28" y="42" width="32" height="46" rx="8" fill="#22c55e" />

  <!-- Down candle (sell pink) -->
  <rect x="80" y="34" width="8" height="72" rx="4" fill="#ec4899" />
  <rect x="68" y="58" width="32" height="40" rx="8" fill="#ec4899" />
</svg>
